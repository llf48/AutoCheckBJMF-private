name: Offline regression tests

on:
  push:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Offline tests (no attendance credentials or live requests)
        run: python -m unittest discover -v

      - name: Create synthetic discovery sample (no BJMF requests)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from discovery_snapshot import capture_discovery_snapshot
          from test_check_outcomes import ACTIVE, config, response
          settings = config(discovery_snapshot_dir="bjmf-discovery-test", _audit_account_number=1)
          markup = ACTIVE + '<script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js?token=synthetic-private-token#synthetic-private-fragment"></script>'
          capture_discovery_snapshot(settings, response(markup), "/punchs?op=ing")
          path = Path("bjmf-discovery-test/account-1-active_list.json")
          record = json.loads(path.read_text(encoding="utf-8"))
          assert record["reason"] == "missing_punch_id" and record["nodes"]
          assert record["schema_version"] == 2
          hint = record["scripts"][0]["source_hint"]
          assert hint["url_without_query"] == "https://res.wx.qq.com/open/js/jweixin-1.6.0.js"
          assert hint["query_values_removed"] and hint["fragment_removed"]
          assert "synthetic-private" not in json.dumps(record)
          print("Synthetic discovery sample created and validated without a platform request.")
          PY
      - name: Upload synthetic discovery sample
        uses: actions/upload-artifact@v4
        with:
          name: bjmf-discovery-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: bjmf-discovery-test/*.json
          if-no-files-found: error
          retention-days: 7

      # Exercise the real GitHub cache transport with synthetic state only.
      # This namespace cannot restore or overwrite production cooldown records.
      - name: Create synthetic cooldown state
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          from cooldown_state import CooldownState
          state = CooldownState("cooldown-cache-test.json")
          state.mark(state.account_key("offline-test-account", ""), 3600)
          PY
      - name: Save synthetic cooldown state
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: cooldown-cache-test.json
          key: bjmf-cooldown-test-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove synthetic local copy
        if: github.event_name != 'pull_request'
        run: python -c "from pathlib import Path; Path('cooldown-cache-test.json').unlink()"
      - name: Restore synthetic cooldown state
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: cooldown-cache-test.json
          key: bjmf-cooldown-test-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Verify synthetic state in a new process
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          from cooldown_state import CooldownState
          state = CooldownState("cooldown-cache-test.json")
          assert state.deadline(state.account_key("offline-test-account", "")) > 0
          print("Synthetic cooldown survived cache save, local removal, restore and a new process.")
          PY
