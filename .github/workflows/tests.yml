name: Offline regression tests

on:
  push:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Offline tests (no attendance credentials or live requests)
        run: python -m unittest discover -v
